name: Update stock data

on:
  # 北京时间 9:00-15:55，周一到周五，每 5 分钟跑一次
  # UTC = 北京时间 - 8 小时，所以 01:00-07:55 UTC
  schedule:
    - cron: '*/5 1-7 * * 1-5'
    # 收盘后再补一次最终快照（北京时间 16:10）
    - cron: '10 8 * * 1-5'
  workflow_dispatch:        # 支持网页手动触发

# 防止并发跑
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write           # 需要 push commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install akshare pandas

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/boards.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
